name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge the author's main
        id: merge
        run: |
          git remote add upstream https://github.com/GeekatplayStudio/music-suite.git || true
          git fetch --quiet upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream has nothing new."
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "music-suite sync"
          git config user.email "sync@users.noreply.github.com"
          git checkout -B sync/upstream
          if git merge --no-edit upstream/main; then
            echo "state=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Structural audit of the merged tree
        if: steps.merge.outputs.state == 'merged'
        run: python3 scripts/qa_audit.py --base origin/main

      - name: Run the tests on the merged tree
        if: steps.merge.outputs.state == 'merged'
        run: |
          python -m pip install --quiet -e ".[dev]"
          python -m pytest tests -q --maxfail=5

      - name: Open the pull request
        if: steps.merge.outputs.state == 'merged'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream
          base: main
          title: "Sync upstream/main"
          body: |
            Automatic merge of the author's changes from `GeekatplayStudio/music-suite`.
            The test suite ran on the merged tree; review the diff before merging.
          labels: upstream
          delete-branch: true

      - name: Fail on conflicts
        if: steps.merge.outputs.state == 'conflict'
        run: |
          echo "::error::Upstream changed the same lines. Run ./scripts/sync_upstream.sh locally and resolve them."
          exit 1
